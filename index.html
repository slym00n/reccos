  const onesHtml = ones.length ? `<div class="ones">${ones.map((r) => { const c = CATS.find((x) => x[0] === r.category); return `<div class="one"><div class="ph">${pic(r.venue)}<div class="badge">#1 ${mark(r.category, c[3], 16)}</div><div class="score ${r.reaction}">${fmt(r.score)}</div></div><div class="body"><div class="name">${esc(r.venue.name)}</div><div class="sub">${esc(r.venue.suburb)} · ${price(r.venue.price_tier)}</div></div></div>`; }).join('')}</div>` : '';

main().catch((e) => { document.getElementById('app').innerHTML = `<div class="center"><p class="note">Couldn’t load these reccos. Try again in a moment.</p></div>`; console.error(e); });
