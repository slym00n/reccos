<!-- Test page (23 Nov 2026): France-Soir's place page from the reccos build, captured from its web version.
     Tapping a video opens TikTok's embed player, as the app's VideoSheet does. Safe to delete. -->
<style>
  [aria-label^="Watch @"] { cursor: pointer; }
  #vs { position: fixed; inset: 0; z-index: 9999; background: #0B0C1E; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .34s cubic-bezier(.2,.8,.2,1); visibility: hidden; }
  #vs.on { transform: none; visibility: visible; }
  #vs .bar { display: flex; align-items: center; gap: 6px; padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; }
  #vs button { width: 44px; height: 44px; border: 0; background: none; padding: 0; display: grid; place-items: center; cursor: pointer; }
  #vs .t { flex: 1; min-width: 0; text-align: center; color: #ECEBFF; font: 600 15px/20px "Helvetica Neue", -apple-system, system-ui, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #vs a { color: #FF5A66; font: 600 17px/44px "Helvetica Neue", -apple-system, system-ui, sans-serif; padding: 0 6px; text-decoration: none; }
  #vs .f { flex: 1; display: flex; padding-bottom: env(safe-area-inset-bottom); }
  #vs iframe { flex: 1; width: 100%; border: 0; background: #0B0C1E; }
</style>
<div id="vs" role="dialog" aria-modal="true" aria-label="Video review">
  <div class="bar">
    <button type="button" aria-label="Close video"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#ECEBFF" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <div class="t"></div>
    <a target="_blank" rel="noopener">TikTok</a>
  </div>
  <div class="f"></div>
</div>
<script>
{
  const VIDEOS = { eatwithkevin: '7507007573665631495', jessinmelb: '7533773980260453640' };
  const vs = document.getElementById('vs'), box = vs.querySelector('.f');
  const open = (user, id) => {
    vs.querySelector('.t').textContent = '@' + user + ' on France-Soir';
    vs.querySelector('a').href = 'https://www.tiktok.com/@' + user + '/video/' + id;
    const f = document.createElement('iframe');
    f.src = 'https://www.tiktok.com/player/v1/' + id + '?autoplay=1&rel=0&description=1&music_info=0';
    f.title = '@' + user + '’s video review of France-Soir';
    f.allow = 'accelerometer; autoplay; encrypted-media; fullscreen; gyroscope; picture-in-picture';
    f.allowFullscreen = true;
    box.replaceChildren(f);
    vs.classList.add('on');
  };
  const close = () => { vs.classList.remove('on'); setTimeout(() => box.replaceChildren(), 360); };
  vs.querySelector('button').addEventListener('click', close);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  document.querySelectorAll('[aria-label^="Watch @"]').forEach((el) => {
    const m = el.getAttribute('aria-label').match(/@([\w.]+)/);
    if (m && VIDEOS[m[1]]) el.addEventListener('click', () => open(m[1], VIDEOS[m[1]]));
  });
}
</script>
