<!-- Test page (24 Nov 2026): Straight Outta Naples' place page from the reccos build, with the proposed TikTok player. Safe to delete. -->
<style>/* reccos TikTok player (prototype). Tokens from the design system: navy-950 #0B0C1E, navy-900 #14162E, navy-800 #1D2040,
   navy-700 #2A2E55, navy-600 #3B4070, ink #ECEBFF, ink-muted #A6A8C8, ink-faint #7C7FA6, red #F5303F, red-text #FF5A66,
   red-tint #411B31, verified #5B8CFF, herb-tile #40513F; radius-xl 28; glass rgba(29,32,64,.55) + blur 24 + saturate 180%.
   Motion: Glide 380ms cubic-bezier(.25,.9,.3,1), Bounce 320ms cubic-bezier(.34,1.56,.64,1), Snap 220ms cubic-bezier(.2,.9,.3,1). */
:root { --glide: cubic-bezier(.25,.9,.3,1); --bounce: cubic-bezier(.34,1.56,.64,1); --snap: cubic-bezier(.2,.9,.3,1); }
[data-vi] { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.vp { position: fixed; inset: 0; z-index: 9000; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #ECEBFF; visibility: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
.vp.on { visibility: visible; }
.vp-dim { position: absolute; inset: 0; background: rgba(11,12,30,.88); -webkit-backdrop-filter: blur(24px) saturate(140%); backdrop-filter: blur(24px) saturate(140%); opacity: 0; transition: opacity 260ms linear; }
.vp.on .vp-dim { opacity: 1; }
.vp.closing .vp-dim { opacity: 0; transition-duration: 300ms; }

/* Top bar: the place on the left, close on the right. */
.vp-top { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 10px) 16px 0 20px; height: 54px; display: flex; align-items: center; gap: 12px; box-sizing: content-box; opacity: 0; transform: translateY(-6px); transition: opacity 220ms var(--snap), transform 220ms var(--snap); }
.vp.ready .vp-top { opacity: 1; transform: none; transition-delay: 120ms; }
.vp-place { flex: 1; min-width: 0; }
.vp-place b { display: block; font: 500 16px/20px inherit; font-family: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vp-place span { display: block; font: 400 13px/18px inherit; font-family: inherit; color: #A6A8C8; }
.vp-glass { width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,.14); background: rgba(29,32,64,.55); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.10); display: grid; place-items: center; padding: 0; color: #ECEBFF; cursor: pointer; transition: transform 220ms var(--snap); flex: none; }
.vp-glass:active { transform: scale(.94); }
.vp-glass svg { display: block; }

/* The rail of cards. Each card is 9:16 with radius-xl; neighbours peek either side. */
.vp-rail { position: absolute; left: 0; right: 0; }
.vp-card { position: absolute; top: 0; left: 0; border-radius: 28px; overflow: hidden; background: #14162E; box-shadow: 0 18px 48px rgba(0,0,0,.55); transform-origin: 50% 50%; will-change: transform, opacity; }
.vp-card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); pointer-events: none; z-index: 6; }
.vp-poster { position: absolute; inset: 0; background: #40513F; overflow: hidden; }
.vp-poster .mk { position: absolute; right: -16%; bottom: -3%; width: 92%; color: #9CCE62; opacity: .95; }
.vp-poster .mk svg { width: 100%; height: auto; display: block; }
.vp-poster .who { position: absolute; left: 0; right: 0; top: 30%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.vp-poster .who img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px rgba(11,12,30,.35), 0 10px 30px rgba(0,0,0,.45); }
.vp-poster .who b { font: 500 15px/20px "Helvetica Neue", Helvetica, Arial, sans-serif; display: flex; align-items: center; gap: 5px; text-shadow: 0 1px 8px rgba(0,0,0,.35); }
.vp-frame { position: absolute; inset: 0; opacity: 0; transition: opacity 260ms linear; }
.vp-frame.live { opacity: 1; }
.vp-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
.vp-shade { position: absolute; left: 0; right: 0; bottom: 0; height: 96px; background: linear-gradient(to top, rgba(11,12,30,.5), rgba(11,12,30,0)); pointer-events: none; z-index: 3; opacity: 0; transition: opacity 260ms linear; }
.vp-card.on .vp-shade { opacity: 1; }
.vp-prog { position: absolute; left: 16px; right: 16px; bottom: 14px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.24); overflow: hidden; z-index: 4; opacity: 0; transition: opacity 200ms linear; }
.vp-card.on .vp-prog { opacity: 1; }
.vp-prog i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #F5303F; border-radius: 2px; transform-origin: 0 50%; transform: scaleX(0); }
.vp-paused { position: absolute; inset: 0; display: grid; place-items: center; z-index: 5; pointer-events: none; }
.vp-paused .vp-glass { width: 72px; height: 72px; border-radius: 36px; transform: scale(.4); opacity: 0; transition: transform 320ms var(--bounce), opacity 160ms linear; }
.vp-card.paused .vp-paused .vp-glass { transform: none; opacity: 1; }
.vp-card.paused .vp-frame { filter: brightness(.82); }
.vp-fail { position: absolute; left: 18px; right: 18px; bottom: 28px; z-index: 5; display: none; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.vp-card.failed .vp-fail { display: flex; }
.vp-fail p { margin: 0; font: 400 15px/20px "Helvetica Neue", Helvetica, Arial, sans-serif; color: #ECEBFF; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
.vp-btn { height: 50px; padding: 0 22px; border-radius: 16px; border: 0; background: #F5303F; color: #0B0C1E; font: 700 17px/50px "Helvetica Neue", Helvetica, Arial, sans-serif; cursor: pointer; transition: transform 320ms var(--bounce); }
.vp-btn:active { transform: scale(.94); }

/* Eyes glancing while the video loads (the design system's waiting eyes). */
.eyes { width: 40px; height: 22px; display: block; }
.eyes .p { transition: transform 300ms var(--snap); }
.vp-card.loading .who .eyes .p, .vp.loading .vp-pager .cur .p { animation: glance 1.6s var(--snap) infinite; }
@keyframes glance { 0%, 18% { transform: translateX(0); } 30%, 48% { transform: translateX(-1.6px); } 60%, 78% { transform: translateX(1.6px); } 90%, 100% { transform: translateX(0); } }

/* Hit areas: everything but the right rail of the playing card, where TikTok's own like, comment and share live. */
.vp-hit { position: absolute; z-index: 2; }

/* Below the card: pager, who, verdict. */
.vp-info { position: absolute; left: 0; right: 0; }
.vp-pager { height: 16px; display: flex; justify-content: center; align-items: center; gap: 6px; }
.vp-pager button { height: 16px; min-width: 8px; padding: 0; border: 0; background: none; display: grid; place-items: center; cursor: pointer; }

    rail.style.top = top + 'px'; rail.style.height = H + 'px';
    cards.forEach((c) => { c.style.width = W + 'px'; c.style.height = H + 'px'; });
    const iw = Math.min(vw - 40, Math.max(W + 40, 360));
    info.style.top = (top + H + 16) + 'px'; info.style.left = Math.round((vw - iw) / 2) + 'px'; info.style.width = iw + 'px';
    Object.assign(hl.style, { left: '0px', top: top + 'px', width: (left + W - RAIL) + 'px', height: H + 'px' });
    Object.assign(hr.style, { left: (left + W) + 'px', top: top + 'px', width: (vw - left - W) + 'px', height: H + 'px' });
    render(0, 0);
  }

  // Place every card for a horizontal drag dx, or a pull down dy on the middle one.
  function render(dx, dy) {
    const step = L.W + GAP;
    cards.forEach((c, i) => {
      const x = L.left + (i - idx) * step + dx;
      const d = Math.min(1, Math.abs(x - L.left) / step);
      let s = 1 - 0.08 * d, y = 0, o = 1 - 0.5 * d;
      if (i === idx && dy > 0) { y = dy; s *= 1 - Math.min(0.16, dy / 900); }
      if (i !== idx && dy > 0) o *= Math.max(0, 1 - dy / 160);
      c.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${s})`;
      c.style.opacity = String(o);
      c.style.visibility = Math.abs(i - idx) > 2 ? 'hidden' : '';
    });
    if (dy > 0) { const f = Math.max(0, 1 - dy / 420); dim.style.opacity = String(f); info.style.opacity = String(Math.max(0, 1 - dy / 140)); $('.vp-top').style.opacity = info.style.opacity; }
    else { dim.style.opacity = ''; info.style.opacity = ''; $('.vp-top').style.opacity = ''; }
  }
  function settle(ms = 380, ease = GLIDE) {
    cards.forEach((c) => { c.style.transition = `transform ${ms}ms ${ease}, opacity ${ms}ms ${ease}`; });
    clearTimeout(settle.t);
    settle.t = setTimeout(() => cards.forEach((c) => { c.style.transition = ''; }), ms + 20);
  }

  // The words under the card: who, their verdict in reccos and what to order.
  function fillMeta() {
    const v = V[idx];
    meta.innerHTML = `<div class="vp-who"><img src="${AV + v.av}" alt=""><div class="t"><b><span class="h">@${v.u}</span>${tick()}</b><span>${v.f} · ${v.date}</span></div>
      <div class="acts"><button class="vp-glass vp-mute" aria-label="${muted ? 'Turn sound on' : 'Mute'}" aria-pressed="${muted}">${muted ? ICON.muted : ICON.sound}</button>
      <button class="vp-glass" data-out aria-label="Open in TikTok">${ICON.out}</button></div></div>
      ${v.score ? `<div class="vp-verdict"><span class="lm" aria-hidden="true">${mark('loved', '#F5303F')}</span><span class="sc" aria-label="Loved, ${v.score}">${v.score}</span>${v.dish ? `<span class="or">Order this: <em>${v.dish}</em></span>` : ''}</div>` : ''}`;
    pager.forEach((b, i) => b.classList.toggle('cur', i === idx));
  }
  function swapMeta(dir) {
    if (reduce) { fillMeta(); return; }
    meta.style.setProperty('--dx', (dir > 0 ? -14 : 14) + 'px');
    meta.classList.add('out');
    setTimeout(() => { fillMeta(); meta.style.setProperty('--dx', (dir > 0 ? 14 : -14) + 'px'); requestAnimationFrame(() => meta.classList.remove('out')); }, 120);
  }
  function setMuted(m, remember) {
    muted = m;
    if (remember) { want = m; try { localStorage.setItem('vp-muted', m ? '1' : '0'); } catch {} }
    const b = root.querySelector('.vp-mute');
    if (b) { b.innerHTML = m ? ICON.muted : ICON.sound; b.setAttribute('aria-pressed', String(m)); b.setAttribute('aria-label', m ? 'Turn sound on' : 'Mute'); }
  }

  // The one live TikTok player.
  const say = (type, value) => { try { live.frame && live.frame.contentWindow.postMessage({ 'x-tiktok-player': true, type, value }, '*'); } catch {} };
  function unmount() {
    if (!live.frame) return;
    say('pause');
    const c = cards[live.i], f = live.frame;
    c.classList.remove('on', 'loading', 'paused', 'failed'); root.classList.remove('loading');
    c.querySelector('.vp-frame').classList.remove('live');
    c.querySelector('.vp-prog i').style.transform = 'scaleX(0)';
    setTimeout(() => f.remove(), 260);
    clearTimeout(live.timer);
    Object.assign(live, { i: -1, frame: null, ready: false, last: 0, loops: 0, playing: false, loud: 0 });
  }
  function mount(i) {
    if (live.i === i && live.frame) return;
    unmount();
    const c = cards[i], f = document.createElement('iframe');
    f.src = `https://www.tiktok.com/player/v1/${V[i].id}?${Q}`;
    f.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
    f.title = `@${V[i].u}’s video of ${DATA.place.name}`;
    c.querySelector('.vp-frame').appendChild(f);
    c.classList.add('on', 'loading'); root.classList.add('loading');
    Object.assign(live, { i, frame: f, ready: false, last: 0, loops: 0, playing: false, loud: 0 });
    live.timer = setTimeout(() => { if (live.frame === f && !live.playing) c.classList.add('failed'); }, 9000);
  }
  addEventListener('message', (e) => {
    if (!live.frame || e.source !== live.frame.contentWindow) return;
    let d = e.data; try { if (typeof d === 'string') d = JSON.parse(d); } catch { return; }
    if (!d || !d['x-tiktok-player']) return;
    const c = cards[live.i];
    if (d.type === 'onPlayerReady') { live.ready = true; say(want ? 'mute' : 'unMute'); say('play'); }
    if (d.type === 'onStateChange') {
      if (d.value === 1) { live.playing = true; c.classList.remove('loading', 'paused', 'failed'); root.classList.remove('loading'); c.querySelector('.vp-frame').classList.add('live'); if (!want && live.loud < 2) { live.loud++; say('unMute'); } }
      if (d.value === 2) c.classList.add('paused');
    }
    if (d.type === 'onCurrentTime' && d.value && d.value.duration) {
      const t = d.value.currentTime, dur = d.value.duration, bar = c.querySelector('.vp-prog i');
      if (t > 0.05) { live.playing = true; c.classList.remove('loading', 'failed'); root.classList.remove('loading'); c.querySelector('.vp-frame').classList.add('live'); }
      if (t + 0.6 < live.last) { bar.style.transition = 'none'; live.loops++; if (live.loops === 1) nudge(); }
      else bar.style.transition = 'transform 520ms linear';
      bar.style.transform = `scaleX(${Math.min(1, t / dur)})`;
      live.last = t;
    }
    if (d.type === 'onMute') setMuted(!!d.value);
    if (d.type === 'onError') c.classList.add('failed');
  });
  function togglePlay() {
    const c = cards[idx];
    if (!live.frame || live.i !== idx) { mount(idx); return; }
    if (c.classList.contains('paused')) { c.classList.remove('paused'); if (!want) say('unMute'); say('play'); }
    else { c.classList.add('paused'); say('pause'); }
  }
  // After a video's first loop, the next card leans in once: there's more.
  function nudge() {
    const next = cards[idx + 1];
    if (!next || reduce || !next.animate) return;
    next.animate([{ translate: '0 0' }, { translate: '-14px 0' }, { translate: '0 0' }], { duration: 560, easing: BOUNCE, iterations: 2 });
  }

  function go(i, dir) {
    i = Math.max(0, Math.min(n - 1, i));
    const moved = i !== idx;
    if (moved) { unmount(); idx = i; swapMeta(dir ?? 1); }
    settle();
    render(0, 0);
    clearTimeout(go.t);
    go.t = setTimeout(() => { if (isOpen) mount(idx); }, moved ? 300 : 0);
  }

  // Gestures on the card area (not the TikTok column): tap to pause, swipe sideways to move, pull down to close.
  let g = null;
  function down(e) { if (!isOpen || busy) return; g = { x: e.clientX, y: e.clientY, t: performance.now(), axis: null, dx: 0, dy: 0, id: e.pointerId }; e.currentTarget.setPointerCapture(e.pointerId); }
  function move(e) {
    if (!g || e.pointerId !== g.id) return;
    let dx = e.clientX - g.x, dy = e.clientY - g.y;
    if (!g.axis && Math.hypot(dx, dy) > 8) g.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : dy > 0 ? 'y' : 'none';
    if (g.axis === 'x') {
      if ((idx === 0 && dx > 0) || (idx === n - 1 && dx < 0)) dx *= 0.35;
      g.dx = dx; render(dx, 0);
      root.querySelectorAll('.vp-pager .cur .p').forEach((p) => { p.style.transform = `translateX(${Math.max(-1.6, Math.min(1.6, -dx / 60))}px)`; });
    }
    if (g.axis === 'y') { g.dy = Math.max(0, dy); render(0, g.dy); }
  }
  function up(e) {
    if (!g || e.pointerId !== g.id) return;
    const dt = Math.max(1, performance.now() - g.t), a = g.axis;
    root.querySelectorAll('.vp-pager .p').forEach((p) => { p.style.transform = ''; });
    if (!a) {
      const x = g.x;
      g = null;
      if (x < L.left) go(idx - 1, -1); else if (x > L.left + L.W) go(idx + 1, 1);
      else if (cards[idx].classList.contains('failed')) window.open(url(V[idx]), '_blank', 'noopener');
      else togglePlay();
      return;
    }
    if (a === 'x') {
      const v = g.dx / dt;
      if (g.dx < -L.W * 0.2 || v < -0.35) go(idx + 1, 1);
      else if (g.dx > L.W * 0.2 || v > 0.35) go(idx - 1, -1);
      else { settle(320, BOUNCE); render(0, 0); }
    }
    if (a === 'y') {
      if (g.dy > 110 || g.dy / dt > 0.5) close(g.dy);
      else { settle(320, BOUNCE); render(0, 0); }
    }
    g = null;
  }
  [hl, hr].forEach((el) => { el.addEventListener('pointerdown', down); el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); });
  dim.addEventListener('click', () => close(0));
  $('.vp-x').addEventListener('click', () => close(0));
  pager.forEach((b, i) => b.addEventListener('click', () => go(i, i > idx ? 1 : -1)));
  root.addEventListener('click', (e) => {
    if (e.target.closest('[data-out]')) window.open(url(V[idx]), '_blank', 'noopener');
    if (e.target.closest('.vp-mute')) { const m = !muted; setMuted(m, true); say(m ? 'mute' : 'unMute'); if (!m && cards[idx].classList.contains('paused')) togglePlay(); }
  });
  addEventListener('keydown', (e) => {
    if (!isOpen) return;
    if (e.key === 'Escape') close(0);
    if (e.key === 'ArrowRight') go(idx + 1, 1);
    if (e.key === 'ArrowLeft') go(idx - 1, -1);
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    if (e.key === 'm') root.querySelector('.vp-mute')?.click();
  });
  addEventListener('resize', () => { if (isOpen) layout(); });

  // Open: the tapped tile grows into the card (Glide); the page dims; the words rise in after it.
  const tileOf = (i) => { const b = document.querySelector(`[data-vi="${i}"]`); return b && (b.firstElementChild || b); };
  function fly(from, to, r0, r1, ms, html, done) {
    const f = document.createElement('div');
    f.className = 'vp-fly';
    f.innerHTML = html;
    Object.assign(f.style, { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px', borderRadius: r0 + 'px' });
    document.body.appendChild(f);
    f.getBoundingClientRect();
    f.style.transition = `left ${ms}ms ${GLIDE}, top ${ms}ms ${GLIDE}, width ${ms}ms ${GLIDE}, height ${ms}ms ${GLIDE}, border-radius ${ms}ms ${GLIDE}`;
    Object.assign(f.style, { left: to.left + 'px', top: to.top + 'px', width: to.width + 'px', height: to.height + 'px', borderRadius: r1 + 'px' });
    setTimeout(() => { done(); f.remove(); }, ms + 10);
    return f;
  }
  function open(i) {
    if (isOpen || busy) return;
    busy = true; isOpen = true; idx = i;
    root.classList.remove('closing', 'ready');
    root.classList.add('on');
    layout(); fillMeta();
    const tile = tileOf(i);
    const target = { left: L.left, top: L.top, width: L.W, height: L.H };
    cards.forEach((c) => { c.style.visibility = 'hidden'; });
    const finish = () => { cards.forEach((c) => { c.style.transition = ''; }); render(0, 0); root.classList.add('ready'); busy = false; mount(idx); };
    if (!tile || reduce) { rail.style.opacity = '0'; render(0, 0); requestAnimationFrame(() => { rail.style.transition = 'opacity 220ms linear'; rail.style.opacity = '1'; }); setTimeout(() => { rail.style.transition = ''; }, 240); finish(); return; }
    const from = tile.getBoundingClientRect();
    tile.style.visibility = 'hidden';
    fly(from, target, 20, 28, 420, poster(V[i]), () => { tile.style.visibility = ''; finish(); });
    // The neighbours slide in from where the rail would be, a beat behind.
    cards.forEach((c, k) => { if (k !== i) { c.style.visibility = Math.abs(k - i) > 2 ? 'hidden' : ''; c.style.opacity = '0'; } });
    setTimeout(() => { cards.forEach((c, k) => { if (k !== i) c.style.transition = 'opacity 260ms linear'; }); render(0, 0); cards[i].style.visibility = 'hidden'; }, 160);
  }
  // Close: the card goes back into its tile on the page (the row scrolls to it first).
  function close(dy) {
    if (!isOpen || busy) return;
    busy = true;
    const tile = tileOf(idx);
    if (tile) {
      let s = tile.parentElement;
      while (s && s !== document.body) { const cs = getComputedStyle(s); if (/(auto|scroll)/.test(cs.overflowX) && s.scrollWidth > s.clientWidth) break; s = s.parentElement; }
      if (s && s !== document.body) { const tr = tile.getBoundingClientRect(), sr = s.getBoundingClientRect(); if (tr.left < sr.left + 20 || tr.right > sr.right - 20) s.scrollLeft += tr.left - sr.left - 20; }
    }
    const from = cards[idx].getBoundingClientRect();
    unmount();
    root.classList.add('closing'); root.classList.remove('ready');
    dim.style.opacity = ''; info.style.opacity = ''; $('.vp-top').style.opacity = '';
    cards.forEach((c, k) => { c.style.transition = 'opacity 180ms linear'; c.style.opacity = '0'; });
    const end = () => { root.classList.remove('on', 'closing'); cards.forEach((c) => { c.style.transition = ''; c.style.opacity = ''; }); isOpen = false; busy = false; };
    if (!tile || reduce) { setTimeout(end, 300); return; }
    const to = tile.getBoundingClientRect();
    tile.style.visibility = 'hidden';
    fly(from, to, 28, 20, 380, poster(V[idx]), () => { tile.style.visibility = ''; end(); });
  }
  document.querySelectorAll('[data-vi]').forEach((el) => el.addEventListener('click', () => open(Number(el.dataset.vi))));
  window.__vp = { open, close, go, get idx() { return idx; }, get live() { return live; } };
}
</script>
</body></html>
